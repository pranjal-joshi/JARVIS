[project]
name = "jarvis-hub"
version = "0.1.0"
description = "JARVIS agent hub: OpenAI-compatible API, event bus, audit log"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "anthropic==2.3.0",
    "mcp==2.3.0",
    "wyoming==1.10.2",
    "pyyaml==6.0.3",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
