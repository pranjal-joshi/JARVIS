<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite Emulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04070a; --panel: rgba(8, 20, 28, 0.62); --edge: rgba(127, 231, 255, 0.22);
    --cyan: #7fe7ff; --cyan-dim: rgba(127, 231, 255, 0.35); --cyan-faint: rgba(127, 231, 255, 0.08);
    --amber: #ffb347; --red: #ff5c5c; --violet: #b48bff; --green: #6dffa8; --text: #cdeff7;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; --display: "Chakra Petch", var(--mono);
    --led: var(--cyan-faint);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #0a1720 0%, var(--bg) 70%); color: var(--text);
    font: 13px/1.5 var(--mono); display: grid; place-items: center; padding: 16px;
  }
  main { width: min(920px, 100%); display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { grid-column: 1 / -1; margin: 0; font: 600 18px var(--display); letter-spacing: 0.3em; color: var(--cyan); }
  h1 small { font: 11px var(--mono); letter-spacing: 0.1em; opacity: 0.55; margin-left: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 10px; font: 600 11px var(--display); letter-spacing: 0.25em; color: var(--cyan-dim); text-transform: uppercase; }

  /* the device: a puck with a 12-LED ring and one button, like a Voice PE */
  .device { display: grid; justify-items: center; gap: 14px; }
  .puck {
    position: relative; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #12222c, #070d12 70%);
    box-shadow: inset 0 0 0 1px var(--edge), 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  .led {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%;
    background: var(--led); transition: background 160ms, box-shadow 160ms;
  }
  .btn {
    position: absolute; inset: 62px; border-radius: 50%; border: 1px solid var(--edge); cursor: pointer;
    background: radial-gradient(circle at 50% 35%, #183040, #0a141b); color: var(--cyan);
    font: 600 11px var(--display); letter-spacing: 0.2em; touch-action: none;
  }
  .btn:active, .btn.down { background: radial-gradient(circle at 50% 45%, #1d3a4d, #0b1820); }
  .btn:focus-visible { outline: 1px solid var(--cyan); outline-offset: 4px; }
  .state { font: 600 13px var(--display); letter-spacing: 0.3em; text-transform: uppercase; }
  .hint { font-size: 11px; opacity: 0.55; text-align: center; }
  form { display: flex; gap: 8px; width: 100%; }
  input[type=text] { flex: 1; min-width: 0; background: #050b0f; border: 1px solid var(--edge); border-radius: 6px;
    color: var(--text); font: inherit; padding: 8px 10px; }
  input[type=text]:focus { outline: none; border-color: var(--cyan-dim); }
  button.plain { background: transparent; border: 1px solid var(--edge); border-radius: 6px; color: var(--cyan);
    font: 600 11px var(--display); letter-spacing: 0.15em; padding: 0 12px; cursor: pointer; }
  button.plain:hover { background: var(--cyan-faint); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; width: 100%; font-size: 11px; }
  .row select { flex: 1; min-width: 0; }
  .row label { opacity: 0.7; }
  select { background: #050b0f; color: var(--text); border: 1px solid var(--edge); border-radius: 6px; font: inherit; padding: 4px 6px; }

  .log { display: grid; gap: 8px; max-height: 70vh; overflow: auto; }
  .ev { display: grid; grid-template-columns: 76px 1fr; gap: 10px; animation: in 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .ev .t { opacity: 0.45; font-size: 11px; }
  .ev b { font: 600 10px var(--display); letter-spacing: 0.2em; margin-right: 6px; }
  .ev.wake b { color: var(--violet); } .ev.stt b { color: var(--cyan); } .ev.reply b { color: var(--green); }
  .ev.tts b { color: var(--amber); } .ev.err b { color: var(--red); }
  .empty { opacity: 0.45; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .ev { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>SATELLITE <small id="name">emulated ESPHome voice satellite · source=satellite</small></h1>

  <section class="panel device" aria-label="Satellite device">
    <h2>Device</h2>
    <div class="puck" id="puck">
      <button class="btn" id="btn" type="button" aria-label="Hold to talk">HOLD<br>TO TALK</button>
    </div>
    <div class="state" id="state" aria-live="polite">idle</div>
    <div class="hint">Say "Hey Jarvis", or hold the button (or Space) to talk. Either one also interrupts a reply. Or type what you'd say:</div>
    <form id="say">
      <input type="text" id="text" placeholder="e.g. what's the weather in Pune" aria-label="Spoken text" autocomplete="off">
      <button class="plain" type="submit">SAY</button>
    </form>
    <div class="row">
      <label for="out">Output</label>
      <select id="out">
        <option value="speaker">Satellite speaker (this page)</option>
        <option value="sendspin" id="ssopt" disabled>Sendspin player (checking…)</option>
      </select>
      <label><input type="checkbox" id="mute"> mute</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="wake" disabled> <span id="wakelabel">wake word</span></label>
    </div>
  </section>

  <section class="panel" aria-label="Event log">
    <h2>Pipeline</h2>
    <div class="log" id="log"><div class="empty">Waiting for a wake… say "Hey Jarvis" or hold the button.</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const COLORS = { idle: "rgba(127,231,255,0.08)", listening: "#b48bff", thinking: "#7fe7ff",
                 replying: "#6dffa8", announcing: "#ffb347", error: "#ff5c5c" };
const N = 12;
const leds = [...Array(N)].map((_, i) => {
  const d = document.createElement("div");
  d.className = "led";
  const a = (i / N) * Math.PI * 2 - Math.PI / 2;
  d.style.transform = `translate(${Math.cos(a) * 100}px, ${Math.sin(a) * 100}px)`;
  $("puck").appendChild(d);
  return d;
});

// ---- LED ring: ESPHome-style per-state animation ----
let state = "idle", level = 0;
function setState(s) { state = s; $("state").textContent = s; if (s === "idle") setTimeout(drainAnnouncements, 0); }
const busy = () => ["listening", "thinking", "replying", "announcing"].includes(state);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function ring(t) {
  const c = COLORS[state];
  leds.forEach((l, i) => {
    let on = 0;
    if (state === "listening") on = 0.35 + Math.min(1, level * 4) * 0.65;
    else if (state === "thinking") on = reduce ? 0.8 : ((i - t / 70) % N + N) % N < 3 ? 1 : 0.15;
    else if (state === "replying" || state === "announcing")
      on = reduce ? 0.9 : 0.5 + 0.5 * Math.sin(t / 180 + i * 0.5) * Math.min(1, level * 6 + 0.3);
    else if (state === "error") on = Math.floor(t / 250) % 2 ? 1 : 0.2;
    l.style.background = on ? c : "var(--led)";
    l.style.opacity = state === "idle" ? 1 : on;
    l.style.boxShadow = on > 0.5 ? `0 0 12px ${c}` : "none";
  });
  requestAnimationFrame(ring);
})(0);

function log(kind, label, text) {
  const box = $("log");
  box.querySelector(".empty")?.remove();
  const d = document.createElement("div");
  d.className = `ev ${kind}`;
  d.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span><span><b>${label}</b></span>`;
  d.lastChild.append(text);
  box.prepend(d);
}

// ---- earcons: short synthesised tones, so you know where you are without looking ----
let fx = null;
function tone(notes, vol = 0.08) {
  if ($("mute").checked) return;
  fx ??= new AudioContext();
  const t0 = fx.currentTime + 0.01;
  for (const [f, at, dur] of notes) {
    const o = fx.createOscillator(), g = fx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(vol, t0 + at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    o.connect(g).connect(fx.destination); o.start(t0 + at); o.stop(t0 + at + dur + 0.05);
  }
}
const EAR = {
  wake: () => tone([[660, 0, 0.12], [880, 0.1, 0.18]]),          // rising: listening
  followup: () => tone([[880, 0, 0.12]], 0.05),                    // one soft note: still listening
  heard: () => tone([[880, 0, 0.08], [660, 0.07, 0.12]], 0.05),    // falling: got it
  pulse: () => tone([[440, 0, 0.2]], 0.025),                       // still thinking
  tool: () => tone([[523, 0, 0.08], [659, 0.06, 0.1]], 0.035),     // a tool started
  announce: () => tone([[784, 0, 0.14], [1047, 0.12, 0.24]]),
  error: () => tone([[330, 0, 0.18], [220, 0.16, 0.32]], 0.1),
};

// ---- speech out: hub TTS, or the browser's own voice when the hub's voice is down ----
let turn = 0, playing = null;
let ssUntil = 0; // Sendspin: when the players should finish what's been queued (performance.now() ms)
function stopAudio() {
  try { playing?.stop(); } catch {} playing = null;
  speechSynthesis.cancel();
  if (ssUntil > performance.now()) { ssUntil = 0; fetch("/api/sendspin/stop", { method: "POST" }).catch(() => {}); }
}
function browserSay(text) {
  return new Promise((res) => {
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
// Sendspin output: the emulator queues each sentence on the players and returns at once; the
// page only estimates playback from the WAV length to keep the ring "replying" meanwhile.
async function sendspinPlay(blob, mine) {
  const r = await fetch("/api/sendspin/play", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: blob });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || `sendspin HTTP ${r.status}`);
  if (!j.players) log("err", "SENDSPIN", "no players connected: sentence dropped");
  if (mine === turn) ssUntil = Math.max(ssUntil, performance.now()) + j.duration_s * 1000;
}
async function sendspinDrain(mine) {
  const meter = setInterval(() => { level = 0.12 + Math.random() * 0.12; }, 120);
  while (mine === turn && performance.now() < ssUntil) await sleep(100);
  clearInterval(meter); level = 0;
}
async function play(blob, mine) {
  const ctx = new AudioContext();
  const b = await ctx.decodeAudioData(await blob.arrayBuffer());
  if (mine !== turn) return ctx.close();
  const src = ctx.createBufferSource(); src.buffer = b;
  const an = ctx.createAnalyser(); an.fftSize = 256; const buf = new Uint8Array(256);
  src.connect(an).connect(ctx.destination);
  const meter = setInterval(() => { an.getByteTimeDomainData(buf); level = Math.max(...buf.map((v) => Math.abs(v - 128))) / 128; }, 50);
  playing = src;
  await new Promise((r) => { src.onended = r; src.start(); });
  clearInterval(meter); level = 0; ctx.close();
}
const ttsCache = new Map(); // the filler line, synthesised once
function tts(text, cache = false) {
  if (cache && ttsCache.has(text)) return ttsCache.get(text);
  const p = fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input: text }) })
    .then((r) => (r.status === 204 ? null : r.ok ? r.blob() : { failed: r.status }))
    .catch(() => ({ failed: "unreachable" }));
  if (cache) { ttsCache.set(text, p); p.then((b) => b?.failed && ttsCache.delete(text)); }
  return p;
}
let voiceDown = false;
function speaker(mine, as = "replying") {
  let chain = Promise.resolve(), spoke = false;
  return {
    get spoke() { return spoke; },
    add(text, { cache = false, label = "TTS" } = {}) {
      if (!text.trim() || $("mute").checked) return;
      spoke = true;
      const t0 = performance.now();
      const audio = tts(text, cache);
      const viaSendspin = $("out").value === "sendspin";
      chain = chain.then(async () => {
        const blob = await audio;
        if (mine !== turn || !blob) return;
        setState(as);
        if (blob.failed) { // the hub's voice is down: say it anyway, in the browser's voice
          if (!voiceDown) log("err", "VOICE", `hub text-to-speech failed (${blob.failed}); using the browser voice`);
          voiceDown = true;
          return browserSay(text);
        }
        voiceDown = false;
        log("tts", label, `${text.trim()} (${Math.round(performance.now() - t0)} ms)${viaSendspin ? " → sendspin" : ""}`);
        if (viaSendspin) await sendspinPlay(blob, mine).catch((e) => log("err", "SENDSPIN", String(e.message || e)));
        else await play(blob, mine);
      });
    },
    done: () => chain.then(() => sendspinDrain(mine)),
  };
}
function sentenceEnd(s) {
  const re = /[.!?…]+["')\]]?\s+|\n\s*\n/g; let m;
  while ((m = re.exec(s))) { const end = m.index + m[0].length; const head = s.slice(0, end);
    if ((head.match(/```/g) || []).length % 2) continue; if (head.trim().length >= 12) return end; }
  return 0;
}

// ---- failures: a distinct tone and one spoken cause ----
async function fail(label, detail, spoken) {
  log("err", label, detail);
  EAR.error(); setState("error");
  const mine = ++turn;
  if (spoken && !$("mute").checked) {
    const blob = await tts(spoken);
    if (mine === turn) { if (blob && !blob.failed) await play(blob, mine); else await browserSay(spoken); }
  }
  await sleep(600);
  if (mine === turn) setState("idle");
}
function cause(detail) {
  if (/hub unreachable|Failed to fetch|NetworkError/i.test(detail)) return "I can't reach my hub, sir.";
  if (/whisper|speech-to-text|transcri/i.test(detail)) return "My hearing is offline, sir. Speech recognition isn't answering.";
  return "Something went wrong on my side, sir.";
}

// ---- one voice turn: text -> hub chat (streamed) -> spoken sentence by sentence ----
let history = [], chatAbort = null;
const FILLER = "One moment, sir.";
async function converse(text) {
  const mine = ++turn; stopAudio(); chatAbort?.abort(); chatAbort = new AbortController();
  log("stt", "HEARD", text);
  history = [...history, { role: "user", content: text }].slice(-8);
  setState("thinking");
  const voice = speaker(mine);
  let shown = "", pending = "", final = null;
  const t0 = performance.now();
  const pulse = setInterval(() => mine === turn && state === "thinking" && EAR.pulse(), 2200);
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ messages: history }), signal: chatAbort.signal });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "", first = null;
    outer: for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      if (mine !== turn) return; // barged in: this turn is over
      buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data:\s*/, ""); buf = buf.slice(i + 2);
        if (line === "[DONE]") break outer;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        const j = ev.jarvis || {};
        if (j.reset) { shown = pending = ""; continue; }
        if (j.tool) { // a tool started: a tick, and a short filler line if nothing has been said yet
          EAR.tool(); log("wake", "TOOL", j.tool);
          if (!voice.spoke) voice.add(FILLER, { cache: true, label: "FILLER" });
        }
        if (j.say) voice.add(j.say, { label: "SAY" }); // e.g. "Please approve on your phone: ..."
        if (j.final != null) final = j.final;
        const piece = ev.choices?.[0]?.delta?.content; if (!piece) continue;
        first ??= Math.round(performance.now() - t0);
        shown += piece; pending += piece; let cut;
        while ((cut = sentenceEnd(pending))) { voice.add(pending.slice(0, cut)); pending = pending.slice(cut); }
      }
    }
    const reply = final ?? shown;
    log("reply", "REPLY", `${reply}${first != null ? `  (first words ${first} ms)` : ""}`);
    history = [...history, { role: "assistant", content: reply }];
    if (!shown.trim()) voice.add(reply); else if (pending.trim()) voice.add(pending);
    await voice.done();
    if (mine !== turn) return;
    // keep listening a moment after every reply, no wake word needed ("and the kitchen too", "yes")
    if (mic.ctx) return listen("followup");
    setState("idle");
  } catch (e) {
    if (e.name === "AbortError" || mine !== turn) return;
    fail("ERROR", String(e.message || e), cause(String(e.message || e)));
  } finally {
    clearInterval(pulse);
  }
}

// ---- microphone: one always-on 16 kHz stream for the wake word, recording and voice barge-in ----
const RATE = 16000, BLOCK = 1600; // 100 ms blocks
const mic = { ctx: null, mode: "off", floor: 0.01, carry: new Float32Array(0), pos: 0 };
let rec = null, wakeOn = false, wakeName = null;
async function micStart() {
  if (mic.ctx) { await mic.ctx.resume(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const ctx = new AudioContext();
  const code = `registerProcessor("tap", class extends AudioWorkletProcessor {
    process(inputs) { const c = inputs[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } });`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  const node = new AudioWorkletNode(ctx, "tap");
  const silent = ctx.createGain(); silent.gain.value = 0;
  ctx.createMediaStreamSource(stream).connect(node).connect(silent).connect(ctx.destination);
  const step = ctx.sampleRate / RATE;
  let acc = [];
  node.port.onmessage = (e) => { // resample to 16 kHz (linear), then cut into 100 ms blocks
    const x = e.data, src = new Float32Array(mic.carry.length + x.length);
    src.set(mic.carry); src.set(x, mic.carry.length);
    let p = mic.pos;
    for (; p + 1 < src.length; p += step) { const i = Math.floor(p), f = p - i; acc.push(src[i] * (1 - f) + src[i + 1] * f); }
    const keep = Math.floor(p); mic.carry = src.slice(keep); mic.pos = p - keep;
    while (acc.length >= BLOCK) { onBlock(Float32Array.from(acc.slice(0, BLOCK))); acc = acc.slice(BLOCK); }
  };
  mic.ctx = ctx;
}
function toPcm(f32) {
  const out = new Int16Array(f32.length);
  f32.forEach((v, i) => { const x = Math.max(-1, Math.min(1, v)); out[i] = x < 0 ? x * 0x8000 : x * 0x7fff; });
  return out;
}
function onBlock(block) {
  let sum = 0; for (const v of block) sum += v * v;
  const rms = Math.sqrt(sum / block.length), pcm = toPcm(block);
  if (mic.mode === "record") return recordBlock(pcm, rms);
  mic.floor = mic.floor * 0.95 + Math.min(rms, 0.05) * 0.05; // ambient level, for end-of-speech
  if (mic.mode === "wake") sendWake(pcm);
}

// wake word: blocks go to the emulator (microWakeWord) one request at a time, batched while one is out
let wakeQ = [], wakeBusy = false, wakeReset = true;
function sendWake(pcm) { wakeQ.push(pcm); if (!wakeBusy) flushWake(); }
async function flushWake() {
  wakeBusy = true;
  while (wakeQ.length && mic.mode === "wake") {
    const sent = wakeQ; wakeQ = [];
    const body = new Int16Array(sent.reduce((n, a) => n + a.length, 0)); let o = 0;
    for (const a of sent) { body.set(a, o); o += a.length; }
    try {
      const r = await fetch("/api/wake", { method: "POST", body: body.buffer,
        headers: { "Content-Type": "application/octet-stream", ...(wakeReset ? { "X-Reset": "1" } : {}) } });
      wakeReset = false;
      if (r.status === 503) { setWake(false, "wake word not loaded in the emulator"); break; }
      if ((await r.json()).hit && mic.mode === "wake") onWake();
    } catch { await sleep(1000); }
  }
  wakeBusy = false;
}
function onWake() {
  const tail = wakeQ; wakeQ = []; wakeReset = true; // audio after the wake word: the start of the command
  if (busy()) { log("wake", "BARGE-IN", "wake word while busy: stopping"); turn++; chatAbort?.abort(); stopAudio(); }
  log("wake", "WAKE", `"${wakeName.replace(/_/g, " ")}" heard`);
  listen("wake", tail);
}

// recording: until 0.9 s of quiet after speech (or the button is released)
function listen(why, pre = []) {
  if (!mic.ctx) return;
  rec = { why, pcm: [...pre], speech: false, quiet: 0, ms: 0 };
  mic.mode = "record";
  (why === "followup" ? EAR.followup : EAR.wake)();
  setState("listening");
}
function recordBlock(pcm, rms) {
  level = Math.min(1, rms * 8);
  rec.pcm.push(pcm); rec.ms += 100;
  if (rms > Math.max(0.015, mic.floor * 3)) { rec.speech = true; rec.quiet = 0; } else rec.quiet += 100;
  if (rec.why === "ptt") return;
  const giveUp = rec.why === "followup" ? 7500 : 4000;
  if ((rec.speech && rec.quiet >= 900) || rec.ms >= 12000 || (!rec.speech && rec.ms >= giveUp)) finishRec();
}
async function finishRec() {
  const r = rec; rec = null; level = 0;
  mic.mode = wakeOn ? "wake" : "off";
  if (!r) return;
  if (!r.speech && r.why !== "ptt") { log("wake", "QUIET", r.why === "followup" ? "no answer: back to sleep" : "heard nothing"); return setState("idle"); }
  EAR.heard(); setState("thinking");
  const mine = ++turn;
  const fd = await fetch("/api/stt", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav(r.pcm) }).catch(() => null);
  if (mine !== turn) return;
  if (!fd || !fd.ok) {
    const detail = fd ? (await fd.json().catch(() => ({}))).detail || `HTTP ${fd.status}` : "hub unreachable";
    return fail("STT", `speech-to-text failed: ${detail}`, cause(fd && fd.status !== 502 ? "transcribe" : detail));
  }
  const j = await fd.json(), text = j.text?.trim();
  if (!text) { log("wake", "QUIET", "heard nothing"); return setState("idle"); }
  if (j.heard) log("stt", "FIXED", `Whisper heard "${j.heard}"`);
  converse(text);
}
function wav(blocks) {
  const n = blocks.reduce((a, b) => a + b.length, 0);
  const out = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, x) => [...x].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); out.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); out.setUint32(16, 16, true);
  out.setUint16(20, 1, true); out.setUint16(22, 1, true); out.setUint32(24, RATE, true); out.setUint32(28, RATE * 2, true);
  out.setUint16(32, 2, true); out.setUint16(34, 16, true); str(36, "data"); out.setUint32(40, n * 2, true);
  let o = 44; for (const b of blocks) for (const v of b) { out.setInt16(o, v, true); o += 2; }
  return new Blob([out.buffer], { type: "audio/wav" });
}

// ---- wake word switch ----
async function setWake(on, why) {
  wakeOn = on && !!wakeName;
  $("wake").checked = wakeOn;
  try { localStorage.setItem("sat.wake", wakeOn ? "1" : "0"); } catch {}
  if (wakeOn) {
    try { await micStart(); } catch { wakeOn = false; $("wake").checked = false; return fail("MIC", "microphone blocked or missing", "I can't use the microphone, sir."); }
    if (mic.mode !== "record") mic.mode = "wake";
    wakeReset = true;
    log("wake", "WAKE WORD", `listening for "${wakeName.replace(/_/g, " ")}"`);
  } else {
    if (mic.mode === "wake") mic.mode = "off";
    if (why) log("err", "WAKE WORD", why);
  }
}
$("wake").addEventListener("change", (e) => setWake(e.target.checked));
// the browser only starts audio after a click: resume then if the wake word was left on
addEventListener("pointerdown", () => mic.ctx?.state === "suspended" && mic.ctx.resume(), true);

// ---- push to talk (also barges in) ----
async function down() {
  if (rec) return;
  turn++; chatAbort?.abort(); stopAudio();
  try { await micStart(); } catch { return fail("MIC", "microphone blocked or missing", "I can't use the microphone, sir."); }
  $("btn").classList.add("down"); log("wake", "WAKE", "button pressed: listening");
  listen("ptt");
}
function up() {
  if (rec?.why !== "ptt") return;
  $("btn").classList.remove("down"); finishRec();
}
$("btn").addEventListener("pointerdown", (e) => { e.preventDefault(); down(); });
addEventListener("pointerup", up);
addEventListener("keydown", (e) => { if (e.code === "Space" && document.activeElement?.tagName !== "INPUT" && !e.repeat) { e.preventDefault(); down(); } });
addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement?.tagName !== "INPUT") up(); });
$("say").addEventListener("submit", (e) => {
  e.preventDefault(); const t = $("text").value.trim(); if (!t) return;
  $("text").value = ""; log("wake", "WAKE", "typed (as if spoken)"); converse(t);
});

// ---- announcements from the hub (timers, skills, calls, background answers) ----
const announcements = [];
async function drainAnnouncements() {
  if (busy() || !announcements.length) return;
  const a = announcements.shift();
  const mine = ++turn;
  log("tts", "ANNOUNCE", `${a.kind ? `[${a.kind}] ` : ""}${a.text}`);
  EAR.announce(); setState("announcing");
  await sleep(450);
  const v = speaker(mine, "announcing");
  v.add(a.text);
  await v.done();
  history = [...history, { role: "assistant", content: a.text }].slice(-8); // so "read it again" works
  if (mine === turn) setState("idle");
}
async function events(info) {
  let ws;
  try {
    const { ticket } = await fetch("/api/events-ticket", { method: "POST" }).then((r) => r.json());
    ws = new WebSocket(info.events);
    ws.onopen = () => ws.send(JSON.stringify({ ticket }));
    ws.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      if (ev.type === "subscribed") log("wake", "HUB", "connected: announcements on");
      if (ev.type === "announce") { announcements.push(ev.data); drainAnnouncements(); }
    };
    ws.onclose = () => { log("err", "HUB", "announcement stream closed; retrying"); setTimeout(() => events(info), 5000); };
  } catch { setTimeout(() => events(info), 5000); }
}

// Sendspin output: offered once the emulator's Sendspin server is up; shows the connected players
async function sendspinStatus() {
  const s = await fetch("/api/sendspin/status").then((r) => r.json()).catch(() => null);
  const opt = $("ssopt");
  opt.disabled = !s?.running;
  opt.textContent = s?.running
    ? `Sendspin player (${s.players.length} connected${s.players.length ? ": " + s.players.join(", ") : ""})`
    : `Sendspin player (${s?.enabled ? "server failed: " + (s.error || "?") : "not running"})`;
  if (opt.disabled && $("out").value === "sendspin") $("out").value = "speaker";
}
sendspinStatus(); setInterval(sendspinStatus, 5000);
fetch("/api/info").then((r) => r.json()).then((i) => {
  $("name").textContent = `${i.name} · source=satellite · hub ${i.hub}`;
  wakeName = i.wake;
  $("wake").disabled = !wakeName;
  $("wakelabel").textContent = wakeName ? `wake word "${wakeName.replace(/_/g, " ")}"` : "wake word (run with uv run --script)";
  let saved = null; try { saved = localStorage.getItem("sat.wake"); } catch {}
  if (wakeName && saved !== "0") setWake(true);
  events(i);
}).catch(() => fail("HUB", "emulator not answering", null));
</script>
